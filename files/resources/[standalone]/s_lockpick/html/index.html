<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="style.css" rel="stylesheet">
    <script src="nui://game/ui/jquery.js"></script>
    <title>lockpick</title>
</head>
    <body>
        <div id="wrap">
            <img src="assets/collar.png" alt="" id="collar" />
            <div id="cylinder"></div>
            <div id="driver"></div>
            <div id="pin">
                <div class="top"></div>
                <div class="bott"></div>
            </div>
        </div>
        <div id="hint-panel">
            <h3>Crochetage</h3>
            <div class="hint-row"><b class="kbd">SOURIS</b><em class="hint-label">Positionner la pointe</em></div>
            <div class="hint-row"><b class="kbd">A</b><b class="kbd">D</b><em class="hint-label">Forcer le cylindre</em></div>
            <div class="hint-row hint-cancel"><b class="kbd">ECHAP</b><b class="kbd">X</b><em class="hint-label">Annuler</em></div>
        </div>
    </body>
    <script src="assets/TweenMax.min.js"></script>
    <script src="script.js" type="text/javascript"></script>
</html>
