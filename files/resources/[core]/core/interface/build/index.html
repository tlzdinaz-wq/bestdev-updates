            if (g > GREEN_MIN && g > r + threshold && g > b + threshold) px[i + 3] = 0;
          }
          ctx.putImageData(imageData, 0, 0);
          return canvas;
        }
        function toPng(canvas, maxW) {
          maxW = maxW || 512;
          if (canvas.width <= maxW) return canvas.toDataURL('image/png', 0.92);
          var scale = maxW / canvas.width;
          var out = document.createElement('canvas');
          out.width = maxW;
          out.height = Math.round(canvas.height * scale);
          var ctx = out.getContext('2d');
          if (ctx) ctx.drawImage(canvas, 0, 0, out.width, out.height);
          return out.toDataURL('image/png', 0.92);
        }
        function postUploaded(url) {
          fetch('https://' + resourceName() + '/nui:mugshotUploaded', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },

        }
        window.addEventListener('message', function (e) {
          var d = e && e.data;
          if (!d || d.action !== 'nui:uploadMugshotFm') return;
          var src = d.data;
          if (!src) {
            postUploaded('');
            return;
          }
          loadCanvas(src).then(function (canvas) {
            return toPng(chromaKey(canvas));
          }).then(function (png) {
            return fetch('https://' + resourceName() + '/nui:uploadMugshotProcessed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify({ data: png })
            }).then(function (r) { return r.json(); });
          }).then(function (json) {
            postUploaded(json && json.url);
          }).catch(function (err) {
            console.error('Mugshot FiveManage', err);
            postUploaded('');
          });
        });
      })();

    <script>
      // Boutique premium : page dédiée (interface/boutique/) qui remplace l'écran du bundle.

      // IMPORTANT: display:none par défaut. Un iframe plein écran en display:block (même
      // transparent) passe AU-DESSUS de #root et masque l'inventaire / le HUD React.
      (function () {
        var BASE = 'position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;z-index:10010;';
        var PASSIVE = BASE + 'display:none;pointer-events:none;';
        var ACTIVE = BASE + 'display:block;pointer-events:auto;';
        var ready = false;
        var pending = [];
        var frame = document.createElement('iframe');
        frame.id = 'boutique';
        frame.src = '../boutique/index.html';
        frame.setAttribute('scrolling', 'no');
        frame.style.cssText = PASSIVE;
        frame.addEventListener('load', function () {
          ready = true;
          while (pending.length) {
            var queued = pending.shift();
            if (frame.contentWindow) frame.contentWindow.postMessage(queued, '*');
          }
        });
        window.__nuiAppend(frame);
        window.__uiDev.register(frame, 'boutique', function () { ready = false; });

        function activate() {
          frame.style.cssText = ACTIVE;
          setTimeout(function () {
            if (frame.contentWindow) frame.contentWindow.focus();
          }, 0);
        }
        function passive() {
          frame.style.cssText = PASSIVE;
          frame.blur();
          window.focus();
        }

        window.addEventListener('message', function (e) {
          var d = e && e.data;
          if (!d || typeof d.action !== 'string') return;
          if (d.action === 'boutique:passive') { passive(); return; }
          // Inventaire ouvert : ne jamais laisser la boutique recouvrir #root.
          if (d.action === 'nui:inventory:visible') {
            if (d.data) passive();
            return;
          }
          if (d.action.indexOf('paidshop:') !== 0 && d.action !== 'core:branding:apply') return;
          if (ready && frame.contentWindow) frame.contentWindow.postMessage(d, '*');
          else pending.push(d);
          if (d.action === 'core:branding:apply') return;
          e.stopImmediatePropagation();
          if (d.action === 'paidshop:show' || d.action === 'paidshop:showPurchaseConfirm') {
            if (document.documentElement.classList.contains('inventory-open')) return;
            activate();
          } else if (d.action === 'paidshop:hide') passive();
        });
      })();

    <script>
      (function () {
        var ACTIONS = ['bossAnnounces:attach', 'bossAnnounces:open', 'bossAnnounces:wake', 'bossAnnounces:close', 'bossPanel:close', 'bossPanel:open'];
        var HIDDEN = 'position:fixed;inset:0;width:0;height:0;border:0;display:none;pointer-events:none;';
        var ready = false;
        var pending = [];
        var overlayOn = false;
        var pageOn = false;
        var placeTimer = null;
        var frame = document.createElement('iframe');
        frame.id = 'boss-announces';
        frame.src = '../boss-announces/index.html';
        frame.setAttribute('scrolling', 'no');
        frame.style.cssText = HIDDEN;
        frame.addEventListener('load', function () {
          ready = true;
          while (pending.length) {
            var queued = pending.shift();
            if (frame.contentWindow) frame.contentWindow.postMessage(queued, '*');
          }
        });
        window.__nuiAppend(frame);
        window.__uiDev.register(frame, 'boss-announces', function () { ready = false; });

        function send(d) {
          if (ready && frame.contentWindow) frame.contentWindow.postMessage(d, '*');
          else pending.push(d);
        }

        function hide() {
          overlayOn = false;
          pageOn = false;
          if (placeTimer) {
            clearInterval(placeTimer);
            placeTimer = null;
          }
          frame.style.cssText = HIDDEN;
          frame.blur();
          send({ action: 'bossAnnounces:close' });
        }

        function findHost() {
          return document.getElementById('boss-announces-page')
            || document.querySelector('.container-boss-panel .boss-panel-layout > .main-content')
            || document.querySelector('.container-boss-panel .main-content')
            || document.querySelector('.boss-panel-layout .main-content');
        }

        function placeOverHost() {
          var host = findHost();
          if (!host) return false;
          var r = host.getBoundingClientRect();
          if (r.width < 20 || r.height < 20) return false;
          frame.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;border:0;margin:0;padding:0;background:#0e1117;z-index:5002;display:block;pointer-events:auto;border-top-right-radius:2rem;border-bottom-right-radius:2rem;';
          overlayOn = true;
          return true;
        }

        function resourceName() {
          return typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'core';
        }

        function requestOpen() {
          fetch('https://' + resourceName() + '/bossPanel:announces:open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: '{}'
          }).then(function (r) { return r.json(); }).then(function (res) {
            if (!pageOn) return;
            var data = (res && (res.announces || (res.ok && res))) || null;
            if (data && typeof data === 'object' && !data.error) {
              send({ action: 'bossAnnounces:open', data: data });
              return;
            }
            send({
              action: 'bossAnnounces:open',
              data: { error: (res && (res.error || res.message)) || 'Impossible de charger les annonces.' }
            });
          }).catch(function () {
            if (!pageOn) return;
            send({ action: 'bossAnnounces:open', data: { error: 'Impossible de charger les annonces.' } });
          });
        }

        function showPage() {
          pageOn = true;
          placeOverHost();
          send({ action: 'bossAnnounces:wake' });
          requestOpen();
          if (!placeTimer) {
            placeTimer = setInterval(function () {
              if (pageOn) placeOverHost();
            }, 250);
          }
        }

        function syncPage() {
          var on = !!document.getElementById('boss-announces-page');
          if (on && !pageOn) showPage();
          else if (!on && pageOn) hide();
        }

        var obs = new MutationObserver(syncPage);
        window.addEventListener('load', function () {
          setTimeout(function () {
            obs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
            syncPage();
          }, 800);
        });
        window.addEventListener('resize', function () {
          if (pageOn) placeOverHost();
        });

        window.addEventListener('message', function (e) {
          var d = e && e.data;
          if (!d || typeof d.action !== 'string' || ACTIONS.indexOf(d.action) === -1) return;
          if (d.action === 'bossAnnounces:open' || d.action === 'bossAnnounces:wake') {
            if (pageOn || document.getElementById('boss-announces-page')) {
              pageOn = true;
              placeOverHost();
            }
            send(d);
            return;
          }
          if (d.action === 'bossAnnounces:close' || d.action === 'bossPanel:close') {
            hide();
            return;
          }
          if (d.action === 'bossPanel:open' || d.action === 'bossAnnounces:attach') {
            setTimeout(syncPage, 50);
            setTimeout(syncPage, 300);
          }
        });
      })();
    </script>

    <script>
      (function () {
        var HUD_ACTIONS = [
          'hud:warn:show', 'hud:warn:progress', 'hud:warn:hide',
          'hud:orbital:show', 'hud:orbital:markers', 'hud:orbital:countdown', 'hud:orbital:hide',
          'hud:megaphone:show', 'hud:megaphone:update', 'hud:megaphone:selector', 'hud:megaphone:hide',
          'hud:crosshair:show', 'hud:crosshair:hide',
          'hud:hack:show', 'hud:hack:state', 'hud:hack:hide',
          // dock staff / animateurs (remplace la barre du bundle : messages bloqués pour lui)
          'staffHud:update', 'staffHud:toggle', 'animatorHud:update', 'animatorHud:toggle',
          'core:branding:apply', 'nui:ui:orientation'
        ];
        var DOCK_ACTIONS = ['staffHud:update', 'staffHud:toggle', 'animatorHud:update', 'animatorHud:toggle'];
        var BASE = 'position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;pointer-events:none;z-index:10000;';
        var HIDDEN = BASE + 'display:none;';
        var SHOWN = BASE + 'display:block;';
        var QUEUE_MAX = 64;
        var open = {};
        var pending = [];
        var ready = false;
        var frame = document.createElement('iframe');
        frame.id = 'hud-overlay';
        frame.src = '../hud/index.html';
        frame.setAttribute('scrolling', 'no');

        frame.addEventListener('load', function () {
          ready = true;
          while (pending.length) {
            var queued = pending.shift();
            if (frame.contentWindow) frame.contentWindow.postMessage(queued, '*');
          }
        });
        window.__nuiAppend(frame);
        window.__uiDev.register(frame, 'hud', function () { ready = false; });

        function anyOpen() {
          for (var key in open) {
            if (open[key]) return true;
          }
          return false;
        }

        window.addEventListener('message', function (e) {
          var d = e && e.data;
          if (!d || typeof d.action !== 'string' || HUD_ACTIONS.indexOf(d.action) === -1) return;
          if (ready && frame.contentWindow) {
            frame.contentWindow.postMessage(d, '*');
          } else if (pending.length < QUEUE_MAX) {
            pending.push(d);
          }
          if (DOCK_ACTIONS.indexOf(d.action) !== -1) {
            e.stopImmediatePropagation();
            var key = d.action.split(':')[0];
            if (d.action.indexOf(':toggle') !== -1) open[key] = d.data === true;
            else if (d.data && typeof d.data.visible === 'boolean') open[key] = d.data.visible;
            frame.style.cssText = anyOpen() ? SHOWN : HIDDEN;
            return;
          }
          if (d.action === 'core:branding:apply') return;
          var parts = d.action.split(':');
          if (parts[2] === 'show') open[parts[1]] = true;
          else if (parts[2] === 'hide') open[parts[1]] = false;
          else return;
          frame.style.cssText = anyOpen() ? SHOWN : HIDDEN;
        });
