<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: nui:; img-src * data: blob: nui:; connect-src *; style-src * 'unsafe-inline'; font-src * data:;">
    <title>Gestion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style.css">
<!--
  Ce qui s'ajoute au <head> de la page construite, après les balises que Vite y
  écrit lui-même (style.css, index.js). L'ordre compte : theme.css et pages.css
  habillent la tablette par-dessus style.css, et chargés avant ils ne
  l'emporteraient plus.

  Ces fichiers ne passent pas par Vite — ils sont écrits à la main dans la base,
  dans interface/gestion/assets/. Le build les laisse en place (emptyOutDir est
  désactivé) mais réécrit index.html : sans ce fragment, chaque build les
  décrochait de la page.

  build.mjs insère ce fichier avant </head> après le build.
-->
<link rel="stylesheet" href="./assets/uilayout.css">
<link id="gh-theme-css" rel="stylesheet" href="./assets/theme.css?v=4">
<link id="gh-pages-css" rel="stylesheet" href="./assets/pages.css?v=4">
<script>
  // Choix d'apparence applique avant le premier rendu : en differe, on verrait
  // la tablette apparaitre puis disparaitre. Le bouton vit dans theme-switch.js.
  (function () {
    try {
      if (localStorage.getItem('gestion-apparence') !== 'classique') return
      document.getElementById('gh-theme-css').disabled = true
      document.getElementById('gh-pages-css').disabled = true
      document.documentElement.classList.add('gh-classique')
    } catch (e) {
      // Stockage indisponible : on garde la tablette.
    }
  })()
</script>
<script src="./assets/uilayout.js"></script>
<script src="./assets/chrome.js"></script>
<script src="./assets/theme-switch.js?v=1" defer></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
